name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portfolio-next/Portfolio-main/package-lock.json

      - name: Install dependencies
        working-directory: portfolio-next/Portfolio-main
        run: npm ci --no-audit --no-fund

      - name: Type-check
        working-directory: portfolio-next/Portfolio-main
        run: npm run typecheck

      - name: Lint
        working-directory: portfolio-next/Portfolio-main
        run: npm run lint

      - name: Production build
        working-directory: portfolio-next/Portfolio-main
        run: npm run build
