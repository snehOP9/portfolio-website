name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: portfolio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: portfolio-next/Portfolio-main/package-lock.json

      - name: Refresh patched dependency lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: portfolio-next/Portfolio-main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin "${GITHUB_HEAD_REF}"
          git checkout -B "${GITHUB_HEAD_REF}" "origin/${GITHUB_HEAD_REF}"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update dependency lockfile"
            git push origin "${GITHUB_HEAD_REF}"
          fi

      - name: Install dependencies
        working-directory: portfolio-next/Portfolio-main
        run: npm ci --no-audit --no-fund

      - name: Type-check
        working-directory: portfolio-next/Portfolio-main
        run: npm run typecheck

      - name: Lint
        working-directory: portfolio-next/Portfolio-main
        run: npm run lint

      - name: Production build
        working-directory: portfolio-next/Portfolio-main
        run: npm run build

      - name: Audit production dependencies
        working-directory: portfolio-next/Portfolio-main
        run: npm audit --omit=dev --audit-level=high

      - name: Smoke-check exported HTML
        working-directory: portfolio-next/Portfolio-main
        run: npm run check:static-output

      - name: Check static accessibility and links
        working-directory: portfolio-next/Portfolio-main
        run: npm run check:static-quality
